<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrapper">
    <div class="container">
        <h1>✨ My To-Do List</h1>

        <div class="input-section">
            <input type="text" placeholder="Add a new task (UI only)">
            <button disabled>Add</button>
        </div>

        <ul class="todo-list">

            <li>
                <input type="checkbox" id="task1">
                <label for="task1">Complete HTML project</label>
            </li>

            <li>
                <input type="checkbox" id="task2">
                <label for="task2">Study CSS Flexbox</label>
            </li>

            <li>
                <input type="checkbox" id="task3">
                <label for="task3">Prepare resume</label>
            </li>

        </ul>
    </div>
</div>

</body>
</html>
